name: Санкт-Петербург
tagline: Заплатки, брусчатка и закрашенные стены
intro: >
  Семь прогулок. Первая съедает весь день и стоит того, «Заплатки» и «Полторы
  комнаты» лучше утром, Лиговка — вечером, Невский можно вклинить между делами.
  Две разведки — Петроградка и Пески: точки свежие, часть ещё не хожена.
order: [admiral, zaplatki, liteyny, peski, ligovka, nevsky, petrogradka]
